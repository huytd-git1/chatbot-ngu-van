# ==============================================================================
# Render Blueprint - Triển khai tự động Web Service và PostgreSQL trên Render
# ==============================================================================
services:
  - type: web
    name: co-duong-day-van
    runtime: node
    plan: free
    region: singapore # Chọn khu vực gần Việt Nam để giảm độ trễ
    buildCommand: npm run install:all && npm run build
    startCommand: npm run migrate && npm run start
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      - key: APP_ORIGIN
        value: https://co-duong-day-van.onrender.com
      - key: SESSION_SECRET
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: co-duong-db
          property: connectionString
      - key: GEMINI_API_KEY
        sync: false # Nhập tay an toàn trên Render Dashboard
      - key: GEMINI_MODEL
        value: gemini-3.8-flash
      - key: DAILY_STUDENT_QUOTA
        value: "20"
      - key: SYSTEM_HARD_CAP
        value: "5000"

databases:
  - name: co-duong-db
    plan: free
    region: singapore
    databaseName: coduong_db
    user: coduong_admin
