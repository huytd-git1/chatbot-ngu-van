# ==============================================================================
# Render Blueprint - Triển khai tự động Web Service "Cô Dương dạy văn dễ thương"
# ==============================================================================
services:
  - type: web
    name: co-duong-ngu-van
    runtime: node
    plan: free
    region: singapore
    autoDeploy: false
    buildCommand: npm run install:all && npm run build
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: NPM_CONFIG_PRODUCTION
        value: "false"
      - key: PORT
        value: 10000
      - key: SESSION_SECRET
        generateValue: true
      - key: DATABASE_URL
        sync: false # Render giữ nguyên chuỗi kết nối PostgreSQL người dùng đã cấu hình trong Dashboard, không ghi đè thành memory
      - key: GEMINI_API_KEY
        value: "" # Nhập trực tiếp trên web tại trang Admin sau khi mở
      - key: GEMINI_MODEL
        value: gemini-3.8-flash
      - key: DAILY_STUDENT_QUOTA
        value: "20"
      - key: SYSTEM_HARD_CAP
        value: "5000"
