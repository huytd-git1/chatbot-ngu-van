# ==============================================================================
# Render Blueprint - Triển khai tự động Web Service "Cô Dương dạy văn dễ thương"
# ==============================================================================
services:
  - type: web
    name: co-duong-day-van
    runtime: node
    plan: free
    region: singapore
    buildCommand: npm install --prefix backend && npm install --prefix frontend && npm run build
    startCommand: npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      - key: SESSION_SECRET
        generateValue: true
      - key: DATABASE_URL
        value: memory # Mặc định in-memory để chạy ngay lập tức; dán connection string PostgreSQL vào Environment khi cần lưu trữ lâu dài
      - key: GEMINI_API_KEY
        value: "" # Nhập trực tiếp trên web tại trang Admin sau khi mở
      - key: GEMINI_MODEL
        value: gemini-3.8-flash
      - key: DAILY_STUDENT_QUOTA
        value: "20"
      - key: SYSTEM_HARD_CAP
        value: "5000"
