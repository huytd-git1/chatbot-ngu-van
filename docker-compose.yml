services:
  postgres:
    image: postgres:16-alpine
    container_name: ${CONTAINER_NAME_POSTGRES:-chatbot-postgres}
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-coduong}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-coduong_secret_pass_2026}
      POSTGRES_DB: ${POSTGRES_DB:-chatbot_ngu_van}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-coduong} -d ${POSTGRES_DB:-chatbot_ngu_van}"]
      interval: 5s
      timeout: 5s
      retries: 5

  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: ${CONTAINER_NAME_APP:-chatbot-app}
    restart: always
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "${APP_PORT:-10000}:10000"
    environment:
      NODE_ENV: production
      PORT: 10000
      DATABASE_URL: postgresql://${POSTGRES_USER:-coduong}:${POSTGRES_PASSWORD:-coduong_secret_pass_2026}@postgres:5432/${POSTGRES_DB:-chatbot_ngu_van}?sslmode=disable
      DB_SSL: "false"
      SESSION_SECRET: ${SESSION_SECRET:-coduong-day-van-super-secret-key-production-32-chars!}
      COOKIE_SECURE: ${COOKIE_SECURE:-false}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      GEMINI_MODEL: ${GEMINI_MODEL:-gemini-2.5-flash}
      DAILY_STUDENT_QUOTA: ${DAILY_STUDENT_QUOTA:-20}
      SYSTEM_HARD_CAP: ${SYSTEM_HARD_CAP:-5000}
    volumes:
      - uploads_data:/app/uploads

volumes:
  postgres_data:
  uploads_data:
